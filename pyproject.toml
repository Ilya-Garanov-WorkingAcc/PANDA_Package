[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "panda-md"
version = "0.1.0"
description = "PANDA (Predicting Angle from Nanoscale Density Analysis): contact angle and interface shape of confined liquids from 1D density profiles of molecular simulations"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ilya Garanov" }]
keywords = ["molecular dynamics", "contact angle", "wetting", "nanopores", "density profile"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.6",
    "typer>=0.27.2",  # typer.TyperException exists from 0.27.2 (click is vendored since 0.26)
    "tomli>=2 ; python_full_version < '3.11'",
    "typing-extensions>=4.6",
]

[project.scripts]
panda = "panda_md.cli:console"

[project.urls]
Repository = "https://github.com/Ilya-Garanov-WorkingAcc/PANDA_Package"

[project.optional-dependencies]
md = [
    "mdanalysis>=2.7",
]
plot = [
    "matplotlib>=3.8",
]

# Dependency groups (PEP 735) are not part of the published package.
#   uv sync: group dev (everything for development)
#   uv sync --no-default-groups --group test: the package and what the tests need, nothing else
[dependency-groups]
test = [
    "pytest>=8",
    "pytest-cov>=5",
]
lint = [
    "black>=24",
    "ruff>=0.6",
    "mypy>=1.11",
    "scipy-stubs>=1.14; python_version >= '3.11'",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    "ipykernel>=6.29",  # .venv kernel for examples/test_panda.ipynb in VS Code (WSL) and Jupyter
    "ipywidgets>=8",  # progress bars of MDAnalysis in notebooks (no TqdmWarning)
]
docs = [
    "mkdocs>=1.6,<2",  # mkdocs-material is incompatible with MkDocs 2.0
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[tool.hatch.build.targets.wheel]
packages = ["src/panda_md"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/README.md", "/CHANGELOG.md", "/CITATION.cff", "/LICENSE", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
markers = ["slow: long tests (synthetic validation, MD)"]

[tool.black]
target-version = ["py310", "py311", "py312", "py313"]
line-length = 120
extend-exclude = "/(PANDA|smoke|docs)/"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["PANDA", "smoke", "docs", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ANN", "RUF", "NPY"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Greek letters and math symbols in strings and comments

[tool.ruff.lint.per-file-ignores]
"examples/build_test_notebook.py" = ["E501"]  # markdown tables of the notebook cells

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests", "validation"]
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["MDAnalysis", "MDAnalysis.*"]  # MDAnalysis ships no type annotations
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tomli"]  # needed on Python 3.10 only; mypy checks the 3.10 branch, the dev environment is newer
ignore_missing_imports = true
