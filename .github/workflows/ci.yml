name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # publish.yml: publish only after the whole CI

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - run: uv run black . -l 120 --check
      - run: uv run ruff check
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      # only the package with [md, plot] and the test group: tests must not depend on the dev tools
      - run: uv sync --no-default-groups --group test --extra md --extra plot
      - run: uv run --no-sync pytest

  # lower bounds of the dependencies in pyproject.toml (numpy 1.26, scipy 1.11, pydantic 2.6, typer 0.27.2, …)
  test-lowest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv .venv-lowest --python 3.10
      - run: uv pip install --python .venv-lowest --resolution lowest-direct ".[md,plot]" "pytest>=8"
      - run: .venv-lowest/bin/python -m pytest
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --group docs mkdocs build --strict

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - run: uv run --isolated --no-project --with dist/*.whl python -c "import panda_md; print(panda_md.__version__)"
      - run: uv run --isolated --no-project --with dist/*.whl panda shapes --pore slit  # console script
      # wheel without extras: plotting gives a clear error, not an ImportError of matplotlib
      - run: |
          uv run --isolated --no-project --with dist/*.whl python -c "import importlib
          from panda_md.core.errors import MissingDependencyError
          try: importlib.import_module('panda_md.plotting')
          except MissingDependencyError: print('without matplotlib: clear error')
          else: raise SystemExit('matplotlib must not be installed with the plain wheel')"
