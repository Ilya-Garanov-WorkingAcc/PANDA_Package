name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - run: uv run black . -l 120 --check
      - run: uv run ruff check
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      # только пакет с [md, plot] и группа test — тесты не должны зависеть от инструментов разработки
      - run: uv sync --no-default-groups --group test --extra md --extra plot
      - run: uv run --no-sync pytest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - run: uv run --isolated --no-project --with dist/*.whl python -c "import panda_md; print(panda_md.__version__)"
      - run: uv run --isolated --no-project --with dist/*.whl panda shapes --pore slit  # консольный скрипт
      # колесо без extras: графики дают понятную ошибку, а не ImportError matplotlib
      - run: |
          uv run --isolated --no-project --with dist/*.whl python -c "import importlib
          from panda_md.core.errors import MissingDependencyError
          try: importlib.import_module('panda_md.plotting')
          except MissingDependencyError: print('без matplotlib: понятная ошибка')
          else: raise SystemExit('matplotlib не должен входить в колесо без extras')"
